<style>

.btn{height:52px;border-radius:14px;border:none;padding:0 18px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.full{width:100%}
.btn.big{height:60px;font-size:18px}
.btn.primary{background:var(--forest);color:#fff}
.btn.danger{background:var(--alert);color:#fff}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}

.cnt b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.cnt span{font-size:13px;color:var(--muted)}
.cnt.warn{background:var(--alert-soft)} .cnt.warn b{color:var(--alert-ink)} .cnt.warn span{color:var(--alert-ink)}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}

.bar{height:10px;border-radius:5px;background:#E4E0D4;overflow:hidden}

.link{background:none;border:none;color:var(--forest);font-weight:600;padding:10px 0;font-size:15px;text-decoration:underline}
.center{text-align:center}
.leaflet-tooltip.nm{font-family:inherit;font-weight:700;font-size:12px;padding:2px 6px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

  function ensureMap() {

function viewMember() {

  arrowBox.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L19 20 L12 16 L5 20 Z" fill="#F6C89F"/></svg>';

    } catch { return toast('이 휴대폰에서는 나침반을 쓸 수 없어요'); }
    compassOn = true;

    setTimeout(() => { if (compassOn && heading == null) toast('나침반 정보를 받지 못했어요. 지도 기준 방향으로 보여드려요'); }, 3000);

      el('label', { class: 'f', for: 'lp' }, '인솔자 비밀번호', iP),
      el('div', { class: 'row' }, el('button', { class: 'btn line small grow', text: '닫기', onclick: () => bg.remove() }), ok)));

    app.replaceChildren(el('div', { class: 'stack' }, roleBar('member'),
      el('h1', { text: '나들이가 끝났어요' }),
      el('p', { class: 'sub', text: '위치 공유가 꺼졌고 서버에 있던 기록은 지워졌어요.' }),
      trackCard(tripId, false)));
  }

  function send(pos) {
    last = pos;
    const { latitude: lat, longitude: lng, accuracy: acc } = pos.coords;
    const moved = lastSent ? dist(lastSent.lat, lastSent.lng, lat, lng) : Infinity;
    if (lastSent && Date.now() - lastSent.at < SEND_MIN_MS && moved < SEND_MIN_M) return;
    lastSent = { lat, lng, at: Date.now() };
    if (!me) return;
    me = Object.assign({}, me, { lat, lng, acc: Math.round(acc), ts: serverTimestamp() });
    pub(myTopic(), me).catch(() => {});
  }
  function startGps() {
    if (watchId != null || !navigator.geolocation) { if (!navigator.geolocation) gpsState = 'none'; return; }
    watchId = navigator.geolocation.watchPosition(p => { gpsState = 'on'; send(p); if (info && isGo(info) && me && me.status !== 'done') trackAdd(tripId, p.coords.latitude, p.coords.longitude, p.coords.accuracy, info.name); if (info) render(); },
      e => { gpsState = e.code === 1 ? 'denied' : 'weak'; if (info) render(); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
    hb = setInterval(() => { if (last && document.visibilityState === 'visible') { lastSent = null; send(last); } }, HEARTBEAT_MS);
  }
  function stopGps() {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null; clearInterval(hb); hb = null; gpsState = 'off';
  }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    if (last) { lastSent = null; send(last); }
    if (wantWake && !wake) await lockWake();
  });
  async function lockWake() {
    try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; if (info) render(); }); }
    catch { wake = null; toast('이 휴대폰에서는 화면 켜두기를 쓸 수 없어요'); wantWake = false; }
    if (info) render();
  }
  async function toggleWake() {
    if (wantWake) { wantWake = false; try { await wake?.release(); } catch {} wake = null; render(); }
    else { wantWake = true; await lockWake(); }
  }
  function patchMe(data, okMsg) {
    me = Object.assign({}, me, data); render();
    pub(myTopic(), me).then(() => okMsg && toast(okMsg), () => toast('보내지 못했어요. 인터넷 연결을 확인해 주세요'));
  }
  const PRESET_MSG = ['화장실 들렀다 갈게요', '잠깐 쉬었다 갈게요', '먼저 가고 있을게요', '사진 찍고 바로 갈게요'];
  function openMsg() {
    const custom = el('input', { type: 'text', id: 'mm', placeholder: '직접 쓰기 (60자까지)', maxlength: 60 });
    const bg = el('div', { class: 'sheet-bg', onclick: e => { if (e.target === bg) bg.remove(); } });
    const sendMsg = t => { bg.remove(); patchMe({ msg: { text: t, ts: serverTimestamp() } }, '인솔자에게 보냈어요'); };
    bg.append(el('div', { class: 'sheet', role: 'dialog', 'aria-label': '인솔자에게 한마디' },
      el('h2', { text: '인솔자에게 한마디' }),
      el('p', { class: 'sub', style: 'margin:0', text: '인솔자에게만 보여요. 급한 일은 "도움이 필요해요"를 누르세요.' }),
      PRESET_MSG.map(t => el('button', { class: 'preset', text: t, onclick: () => sendMsg(t) })),
      el('label', { class: 'f', for: 'mm' }, '직접 쓰기', custom),
      el('div', { class: 'row' }, el('button', { class: 'btn line small grow', text: '닫기', onclick: () => bg.remove() }),
        el('button', { class: 'btn primary small grow', text: '보내기', onclick: () => { const t = custom.value.trim(); if (t) sendMsg(t); } }))));
    document.body.append(bg);
  }
  function setStatus(status, msg) {
    const data = { status, statusTs: serverTimestamp() };
    if (status === 'done') Object.assign(data, { lat: null, lng: null, acc: null });
    me = Object.assign({}, me, data); render();
    pub(myTopic(), me).then(() => toast(msg), () => toast('보내지 못했어요. 인터넷 연결을 확인해 주세요'));
  }

  let joinShown = false;
  function render() {
    if (!me) { if (!joinShown) renderJoin(); return; }
    joinShown = false;
    const myOff = last && hasRoute(info) ? routeDist(last.coords.latitude, last.coords.longitude, info.route) : null;
    const T = target(info);
    const meetDist = last && T.lat != null ? dist(last.coords.latitude, last.coords.longitude, T.lat, T.lng) : null;
    lastBearing = meetDist != null ? bearing(last.coords.latitude, last.coords.longitude, T.lat, T.lng) : null;
    updateArrow();
    const pill = me.status === 'done' ? el('span', { class: 'pill off' }, el('i'), '공유 꺼짐')
      : gpsState === 'on' ? el('span', { class: 'pill on' }, el('i'), '위치 공유 중')
      : gpsState === 'denied' ? el('span', { class: 'pill bad' }, el('i'), '위치 권한 필요')
      : el('span', { class: 'pill off' }, el('i'), '위치 찾는 중');

    app.replaceChildren(el('div', { class: 'stack' },
      roleBar('member'),
      el('div', { class: 'row', style: 'justify-content:space-between;align-items:flex-start' },
        el('div', { class: 'grow' }, el('div', { class: 'sub', text: `${me.name} 님 참여 중` }), el('h1', { style: 'font-size:21px', text: info.name })), pill),
      notice ? el('div', { class: 'banner info', role: 'alert' }, el('b', { text: `인솔자 알림 (${fmtClock(notice.ts)})` }), el('div', { style: 'font-size:17px', text: notice.text }),
        me.ackTs === notice.ts ? el('div', { class: 'sub', style: 'color:var(--blue-ink)', text: '확인했다고 알렸어요' })
          : el('button', { class: 'btn primary small', style: 'align-self:flex-start', text: '확인했어요', onclick: () => patchMe({ ackTs: notice.ts }, '인솔자에게 확인을 알렸어요') })) : null,
      el('div', { class: 'clock' },
        el('div', {}, el('div', { class: 'lbl', text: isGo(info) ? '도착까지' : '출발까지' }), el('div', { style: 'font-weight:600;font-size:17px', text: `${fmtClock(T.at)} ${T.place}` })),
        el('div', { class: 'big', text: fmtLeft(T.at - now()) })),
      myOff != null && isGo(info) && me.status !== 'done' && myOff > offLimit(last.coords.accuracy) ? el('div', { class: 'banner alert', role: 'alert' },
        el('b', { text: `예정 경로에서 약 ${fmtDist(myOff)} 벗어났어요` }),
        el('div', { text: '지도의 초록 선이 예정 경로예요. 길이 확실하지 않으면 그 자리에서 인솔자에게 연락하세요.' })) : null,
      mBox,
      isGo(info) ? trackCard(tripId, me.status !== 'done') : null,
      gpsState === 'denied' ? el('div', { class: 'banner alert' }, el('b', { text: '위치 권한을 허용해 주세요' }), el('div', { text: '주소창 옆 자물쇠(또는 설정) 아이콘을 눌러 위치를 허용한 뒤 새로고침하세요.' })) : null,
      meetDist != null ? el('div', { class: 'card row', style: 'gap:14px' },
        arrowBox,
        el('div', { class: 'grow' }, el('div', { class: 'sub', text: `${T.label} ${T.place}까지 직선거리` }), el('b', { style: 'font-size:24px', text: fmtDist(meetDist) }), dirEl),
        el('button', { class: 'btn small ' + (compassOn ? 'primary' : 'line'), text: compassOn ? '나침반 끄기' : '나침반', onclick: enableCompass })) : null,
      me.status === 'done'
        ? el('div', { class: 'banner ok' }, el('b', { text: '도착을 알렸어요. 수고하셨어요!' }), el('div', { text: '위치 공유를 껐어요.' }),
            el('button', { class: 'link', style: 'align-self:flex-start;color:var(--forest-ink)', text: '잘못 눌렀어요, 다시 이동 중으로', onclick: () => setStatus('hiking', '다시 이동 중으로 바꿨어요') }))
        : el('div', { class: 'stack', style: 'gap:10px' },
            !isGo(info) && me.status === 'start'
              ? el('div', { class: 'banner ok' }, el('b', { text: '집결지 도착을 알렸어요' }), el('div', { text: '출발할 때까지 기다려 주세요.' }),
                  el('button', { class: 'link', style: 'align-self:flex-start;color:var(--forest-ink)', text: '잘못 눌렀어요', onclick: () => setStatus('hiking', '다시 오는 중으로 바꿨어요') }))
              : el('button', { class: 'btn primary full big', text: isGo(info) ? '도착지에 도착했어요' : '집결지에 도착했어요',
                  onclick: () => isGo(info) ? setStatus('done', '인솔자에게 도착을 알렸어요') : setStatus('start', '인솔자에게 집결지 도착을 알렸어요') }),
            el('button', { class: 'btn line full big', text: me.status === 'late' ? '늦는다고 알렸어요' : '10분 정도 늦어요', disabled: me.status === 'late', onclick: () => setStatus('late', '인솔자에게 늦는다고 알렸어요') }),
            el('button', { class: 'btn danger full big', text: me.status === 'help' ? '도움 요청을 보냈어요' : '도움이 필요해요', disabled: me.status === 'help',
              onclick: () => { if (confirm('인솔자에게 도움 요청과 현재 위치를 보낼까요?')) setStatus('help', '도움 요청을 보냈어요. 곧 연락이 갈 거예요'); } }),
            el('button', { class: 'btn line full', text: '인솔자에게 한마디', onclick: openMsg }),
            me.msg && me.msg.ts ? el('div', { class: 'sub', text: `보낸 한마디: "${me.msg.text}" (${fmtClock(me.msg.ts)})` }) : null,
            me.status === 'help' || me.status === 'late' ? el('button', { class: 'link', style: 'align-self:flex-start', text: '이제 괜찮아요', onclick: () => setStatus('hiking', '인솔자에게 괜찮다고 알렸어요') }) : null),
      me.status !== 'done' ? el('div', { class: 'card stack' },
        el('div', { class: 'row', style: 'justify-content:space-between' }, el('b', { text: '화면 켜두기' }),
          el('button', { class: 'btn small ' + (wake ? 'primary' : 'line'), text: wake ? '켜둠' : '켜기', onclick: toggleWake })),
        el('div', { class: 'sub', text: '화면이 꺼지면 위치 전송이 멈춰요. 이동 중에는 켜두면 인솔자가 위치를 계속 볼 수 있어요. 배터리를 더 써요.' })) : null,
      switchLink(),
      el('button', { class: 'link', style: 'margin-top:8px;color:var(--muted)', text: '나들이에서 나가기', onclick: () => {
        if (!confirm('나들이에서 나갈까요? 인솔자 목록에서 빠지고 위치 공유가 꺼져요.')) return;
        stopGps(); me = null; pub(myTopic(), null); delete joined[tripId]; ls.set('joined', joined); render(); } })
    ));
    drawMemberMap();
  }

  function renderJoin() {
    const iName = el('input', { type: 'text', id: 'nm', placeholder: '예: 이정숙', maxlength: 20, value: ls.get('myName', '') });
    const iAgree = el('input', { type: 'checkbox', id: 'ag' });
    const btn = el('button', { class: 'btn primary full big', text: '나들이 참여하기' });
    btn.onclick = async () => {
      const name = iName.value.trim();
      if (!name) return toast('이름을 적어주세요');
      if (!iAgree.checked) return toast('위치 공유에 동의해야 참여할 수 있어요');
      btn.disabled = true;
      try {
        me = { name, status: 'hiking', statusTs: serverTimestamp() };
        await pub(myTopic(), me);
        startGps(); render();
        ls.set('myName', name); joined[tripId] = true; ls.set('joined', joined);
      } catch (e) { btn.disabled = false; toast('참여하지 못했어요. 인터넷 연결을 확인해 주세요'); }
    };
    joinShown = true;
    app.replaceChildren(el('div', { class: 'stack' },
      roleBar('member'),
      el('span', { class: 'pill on', style: 'align-self:flex-start' }, '앱 설치 없이 참여해요'),
      el('div', {}, el('div', { class: 'sub', text: `${info.leaderName} 님이 나들이에 초대했어요` }), el('h1', { style: 'font-size:26px', text: info.name })),
      el('div', { class: 'card stack', style: 'gap:8px' },
        el('div', { class: 'row', style: 'justify-content:space-between;gap:12px' }, el('span', { class: 'sub', text: '출발 집결지' }), el('b', { style: 'text-align:right', text: info.startPlace || info.meetPlace })),
        el('div', { class: 'row', style: 'justify-content:space-between;gap:12px' }, el('span', { class: 'sub', text: '출발 예정시간' }), el('b', { style: 'text-align:right', text: new Date(info.startAt ?? info.meetAt).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' }) })),
        el('div', { class: 'row', style: 'justify-content:space-between;gap:12px' }, el('span', { class: 'sub', text: '종료 예정시간' }), el('b', { style: 'text-align:right', text: fmtClock(info.meetAt) })),
        el('div', { class: 'row', style: 'justify-content:space-between;gap:12px' }, el('span', { class: 'sub', text: '최종 도착지' }), el('b', { style: 'text-align:right', text: info.meetPlace }))),
      el('label', { class: 'f', for: 'nm' }, '이름', iName),
      el('div', { class: 'card check' }, iAgree, el('label', { for: 'ag', text: '나들이 중에만 내 위치를 인솔자와 일행에게 공유해요. 도착지 도착을 누르거나 나들이가 끝나면 꺼지고 기록은 지워져요.' })),
      btn,
      switchLink()));
  }
}
</script>
