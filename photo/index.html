<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2A1E">
<title>사진 글상자</title>
<meta name="description" content="사진 위에 제목·위치·일자·내용·담당을 반투명 글상자로 넣어 저장해요">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F0E8;--card:#FFFDF9;--ink:#2A2118;--muted:#7A6E62;--line:#E6DCCD;--soft:#EFE7DA;--brown:#6B3F1F;--accent:#C8793A;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.45;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:none}
button:active:not(:disabled){transform:scale(.98)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.top b{font-size:18px;font-weight:800}
.lnk{background:none;padding:8px 4px;font-weight:700;color:var(--brown);font-size:15px}
/* 첫 화면 */
.home{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}
.home h1{font-size:32px;margin:0;letter-spacing:-.03em}
.home p{margin:0;color:var(--muted)}
.sample{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#3B2A1E}
.sample canvas{width:100%;display:block}
.big{height:64px;border-radius:18px;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.big.pri{background:var(--brown);color:#fff}
.big.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);text-align:center}
/* 편집 화면 */
.stage{position:relative;flex:1;min-height:0;border-radius:18px;background:#2A2118;overflow:hidden;margin:4px 0 10px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.nav.l{left:8px}.nav.r{right:8px}
.count{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px}
.form{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 138px;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text]{height:44px;border-radius:12px;border:1.5px solid transparent;background:var(--card);color:var(--ink);font-weight:500;padding:0 12px;font-size:16px;width:100%;box-shadow:var(--shadow)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.opts{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 0 0 1.5px var(--line)}
.dot.on{box-shadow:inset 0 0 0 3px #fff,0 0 0 2.5px var(--ink)}
.chipbtn{height:36px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:700;padding:0 12px;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:2px}
.acts .big{flex:1;height:54px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2A2118;color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;z-index:99;max-width:90vw;text-align:center}

/* 아래 칸: 글 / 모양 / 항목 */
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:8px}
.tabs button{flex:1;height:36px;border-radius:10px;background:none;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.panel{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:34vh;padding:2px 2px 4px;margin:0 -2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:40px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;padding:0 12px;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--brown);color:#fff}
.seg button svg{flex-shrink:0}
.optrow{display:flex;align-items:center;gap:10px}
.optrow>span{font-size:13px;font-weight:700;color:var(--muted);width:58px;flex-shrink:0}
.frow{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:4px 6px 4px 10px;box-shadow:var(--shadow)}
.frow input[type=checkbox]{width:22px;height:22px;accent-color:var(--brown);flex-shrink:0}
.frow input[type=text]{height:38px;box-shadow:none;background:var(--soft);font-size:15px}
.frow .mini{width:34px;height:34px;border-radius:9px;background:var(--soft);font-weight:800;flex-shrink:0}
.frow .mini.x{color:#B3261E}
.frow .ttl{flex:1;font-weight:700;font-size:15px}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.preset{flex-shrink:0;width:112px;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;align-items:stretch}
.preset canvas{width:104px;height:65px;border-radius:9px;display:block}
.preset span{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset.on{box-shadow:0 0 0 2.5px var(--brown)}
.add{height:42px;border-radius:12px;background:none;border:1.5px dashed var(--line);font-weight:700;color:var(--brown)}
.tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px;white-space:nowrap;pointer-events:none}
.stage canvas.drag{cursor:grab;touch-action:none}
/* 카메라 */
.cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.cam .view{position:relative;flex:1;min-height:0}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam canvas{touch-action:none}
.cam .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));gap:12px}
.cam .shut{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35)}
.cam .side{width:84px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:14px}
.cam .chips{display:flex;gap:6px;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 8px;flex-wrap:wrap}
.cam .chips button{height:34px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13.5px;padding:0 12px}
.cam .chips button.on{background:#fff;color:#2A2118}
.cam .shots{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:13px;font-weight:700;padding:5px 11px}
@media (max-height:700px){.panel{max-height:28vh}.home h1{font-size:26px}.big{height:56px}input[type=text]{height:40px}.acts .big{height:48px}label.f{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 사진 글상자 =====
// 사진 위에 반투명 글상자(제목 · 일자 · 위치 · 내용 · 담당)를 넣어 한 장의 사진으로 저장해요.
// 앨범 사진은 사진에 들어 있는 찍은 날짜·위치(EXIF)를 읽어 저절로 채우고, 방금 찍은 사진은 지금 위치를 써요.
// 사진은 서버로 보내지 않아요. 위치 이름을 찾을 때만 좌표를 OpenStreetMap 주소 찾기에 보내요.
const app = document.getElementById('app');
// 새 버전 확인: 휴대폰이 예전 화면을 기억해 두는 경우가 있어서, 열 때·돌아올 때 서버 파일의 버전이 다르면 가운데 안내 후 새로고침해요
const PHOTO_VER = '2026-10-01i';
async function checkVer() {
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const PHOTO_VER = '([^']+)'/);
    if (m && m[1] !== PHOTO_VER && sessionStorage.getItem('photoVerTried') !== m[1]) {
      sessionStorage.setItem('photoVerTried', m[1]);
      const n = el('div', { style: 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;pointer-events:none' },
        el('div', { style: 'background:#C8793A;color:#fff;font-weight:800;font-size:18px;border-radius:18px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.3)', text: '새 버전으로 바꿀게요' }));
      document.body.append(n); setTimeout(() => location.reload(), 1800);
    }
  } catch {}
}
checkVer();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !photos.length) checkVer(); });
const ls = {
  get(k, d) { try { const v = localStorage.getItem('photoNote:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('photoNote:' + k, JSON.stringify(v)); } catch {} }
};
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
let toastT = 0;
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', { class: 'toast', role: 'status', text: msg }); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;

// ---------- 사진 속 정보(EXIF): 찍은 날짜와 GPS ----------
async function readExif(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return {};
    let o = 2;
    while (o + 4 < v.byteLength) {
      const mk = v.getUint16(o), len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {   // 'Exif'
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = p => v.getUint16(t + p, le), u32 = p => v.getUint32(t + p, le);
        const ifd = p => { const n = u16(p), m = {}; for (let i = 0; i < n; i++) { const e = p + 2 + i * 12; m[u16(e)] = { type: u16(e + 2), cnt: u32(e + 4), at: e + 8 }; } return m; };
        const str = en => { const p = en.cnt > 4 ? u32(en.at) : en.at; let s = ''; for (let i = 0; i < en.cnt - 1; i++) s += String.fromCharCode(v.getUint8(t + p + i)); return s; };
        const rats = en => { const p = u32(en.at), r = []; for (let i = 0; i < en.cnt; i++) r.push(u32(p + i * 8) / (u32(p + i * 8 + 4) || 1)); return r; };
        const i0 = ifd(u32(4)), out = {};
        let dt = i0[0x0132] ? str(i0[0x0132]) : null;
        if (i0[0x8769]) { const ex = ifd(u32(i0[0x8769].at)); if (ex[0x9003]) dt = str(ex[0x9003]); }
        const m = dt && dt.match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);
        if (m) out.date = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]);
        if (i0[0x8825]) {
          const g = ifd(u32(i0[0x8825].at));
          if (g[2] && g[4]) {
            const dms = a => a[0] + a[1] / 60 + a[2] / 3600;
            let lat = dms(rats(g[2])), lng = dms(rats(g[4]));
            if (g[1] && str(g[1]) === 'S') lat = -lat; if (g[3] && str(g[3]) === 'W') lng = -lng;
            if (lat || lng) { out.lat = lat; out.lng = lng; }
          }
        }
        return out;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch {}
  return {};
}
// 좌표 → 동네 이름 (OpenStreetMap). 못 찾으면 null
const placeCache = {};
async function placeName(lat, lng) {
  const k = lat.toFixed(4) + ',' + lng.toFixed(4);
  if (k in placeCache) return placeCache[k];
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&accept-language=ko`);
    if (!r.ok) return null;
    const j = await r.json(), a = j.address || {};
    return placeCache[k] = ([a.city_district || a.borough || a.county, a.suburb || a.quarter || a.neighbourhood || a.village || a.town].filter(Boolean).join(' ') || j.name || '').slice(0, 30) || null;
  } catch { return null; }
}
function hereNow() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}

// ---------- 글상자 그리기 ----------
const ICO = {
  cal: ['M4 6.5h16v13.5H4z', 'M4 10.5h16', 'M8.5 4v4', 'M15.5 4v4'],
  pin: ['M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z', 'M12 12.3a2.3 2.3 0 1 0 0-4.6a2.3 2.3 0 1 0 0 4.6z'],
  memo: ['M9.5 7h10', 'M9.5 12h10', 'M9.5 17h10', 'M4.5 6h2v2h-2z', 'M4.5 11h2v2h-2z', 'M4.5 16h2v2h-2z'],
  pen: ['M4 20h4L19 9l-4-4L4 16z', 'M13.5 6.5l4 4'],
  tag: ['M3.5 12.5V4.5h8l9 9-8 8z', 'M8 8.5h.01'],
  clock: ['M12 20.5a8.5 8.5 0 1 0 0-17a8.5 8.5 0 1 0 0 17z', 'M12 7.5V12l3 2'],
  people: ['M9 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7z', 'M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5', 'M16 4.3a3.5 3.5 0 0 1 0 6.4', 'M18 14.8c1.8.7 3 2.4 3.5 5.2']
};
function icon(g, k, x, y, size, color) {
  g.save(); g.translate(x, y); g.scale(size / 24, size / 24);
  g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = color;
  ICO[k].forEach(d => g.stroke(new Path2D(d)));
  g.restore();
}
function lines(g, text, maxW, maxLines) {
  const out = []; let line = '';
  for (const ch of String(text)) {
    if (g.measureText(line + ch).width > maxW && line) {
      // 띄어쓰기가 있으면 낱말째로 다음 줄로 넘겨요
      const sp = line.lastIndexOf(' ');
      if (sp > 0 && ch !== ' ') { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { out.push(line); line = ch.trimStart(); }
      if (out.length === maxLines) break;
    }
    else line += ch;
  }
  if (out.length < maxLines && line) out.push(line);
  else if (out.length === maxLines && line) { let l = out[maxLines - 1]; while (l && g.measureText(l + '…').width > maxW) l = l.slice(0, -1); out[maxLines - 1] = l + '…'; }
  return out;
}
// ---------- 글상자 모양 ----------
// 모양: 카드(넓은 상자) · 띠(가로로 얇게) · 세로(세로로 길게) · 글씨만(상자 없이 그림자 글씨)
// note = { title, rows:[{id,icon,label,value}], layout, theme('light'|'dark'), size, color, at:{x,y}|null }
const COLORS = [['갈색', '#6B3F1F', '#FFD9B5'], ['초록', '#1E4D36', '#C9F0D8'], ['남색', '#1D3F6E', '#CFE2FF'], ['빨강', '#9E2A1E', '#FFD0C8'], ['검정', '#1F1F1F', '#FFFFFF']];
const LAYOUTS = [['card', '카드'], ['strip', '가로 띠'], ['column', '세로 기둥'], ['plain', '글씨만'], ['table', '표'], ['tableH', '표·제목띠'], ['table2', '표·두 칸']];
const FONT = "'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
function themeOf(note) {
  const dark = note.theme === 'dark' || note.layout === 'plain';
  const c = COLORS.find(x => x[1] === note.color) || COLORS[0];
  return dark ? { box: 'rgba(22,17,12,.5)', chip: 'rgba(255,255,255,.13)', ink: '#FFFFFF', sub: 'rgba(255,255,255,.75)', title: c[2], edge: 'rgba(255,255,255,.28)' }
    : { box: 'rgba(255,252,246,.62)', chip: 'rgba(255,255,255,.72)', ink: '#2A2118', sub: '#6B6055', title: c[1], edge: 'rgba(255,255,255,.85)' };
}
// 각 모양은 크기를 재고 { w, h, def:[x,y], paint(x,y) }를 돌려줘요
function measureNote(g, note, W, H) {
  const u = Math.min(W, H * 0.8) / 100 * (note.size || 1), m = 4 * u, T = themeOf(note);
  const font = (w, sz) => { g.font = `${w} ${sz}px ${FONT}`; };
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  const text = (t, x, y, color) => { g.fillStyle = color; g.fillText(t, x, y); };
  g.textBaseline = 'top';
  // 표는 켠 항목을 빈 칸까지 모두 그리고(현장 사진 표처럼), 다른 모양은 적은 항목만
  const isTable = ['table', 'tableH', 'table2'].includes(note.layout);
  const rows = isTable ? note.rows : note.rows.filter(r => r.value), fs = 3.7 * u, lh = fs * 1.45, ic = fs * 1.05;

  if (note.layout === 'strip') {
    const p = 2.4 * u, w = W - 2 * m, maxW = w - 2 * p, sfs = 3.5 * u, slh = sfs * 1.5, sic = sfs * 1.05, sep = 3 * u, tfs = 4.3 * u;
    // 한 줄에 이어 쓰고, 넘치면 다음 줄로(두 줄까지)
    const items = [];
    if (note.title) { font(800, tfs); items.push({ kind: 't', text: lines(g, note.title, maxW, 1)[0], w: Math.min(maxW, g.measureText(note.title).width) }); }
    font(500, sfs);
    rows.forEach(r => { const t = lines(g, r.value, maxW - sic - 1.2 * u, 1)[0]; items.push({ kind: 'r', r, text: t, w: sic + 1.2 * u + g.measureText(t).width }); });
    const ln = [[]]; let cx = 0;
    items.forEach(it => { if (cx && cx + sep + it.w > maxW && ln.length < 3) { ln.push([]); cx = 0; } ln[ln.length - 1].push(it); cx += (cx ? sep : 0) + it.w; });
    const lineH = Math.max(slh, note.title ? tfs * 1.35 : 0), h = 2 * p + ln.length * lineH;
    return { w, h, u, def: [m, H - m - h], box: true, paint(x, y) {

          cfg.at[cfg.layout] = { x: b.x / p.W, y: top ? (p.H - b.h - b.x) / p.H : b.x / p.H }; saveCfg(); redraw(); } }, '위↔아래')))
    ];
  }
  // 항목: 켜기/끄기 · 이름 바꾸기 · 순서 · 추가 · 지우기
  function fieldsPanel() {
    const rows = cfg.fields.map((f, i) => {
      const ck = el('input', { type: 'checkbox', checked: f.on, 'aria-label': `${f.label} 넣기`, onchange: () => { f.on = ck.checked; saveCfg(); redraw(); } });
      const nm = el('input', { type: 'text', value: f.label, maxlength: 8, 'aria-label': '항목 이름', oninput: () => { f.label = nm.value; saveCfg(); redraw(); } });
      const mv = d => () => { const j = i + d; if (j < 0 || j >= cfg.fields.length) return; [cfg.fields[i], cfg.fields[j]] = [cfg.fields[j], cfg.fields[i]]; saveCfg(); redraw(); drawPanel(); };
      return el('div', { class: 'frow' }, ck, f.id === 'title' ? el('span', { class: 'ttl', text: '제목 (큰 글씨)' }) : nm,
        el('button', { class: 'mini', 'aria-label': '위로', onclick: mv(-1) }, '↑'), el('button', { class: 'mini', 'aria-label': '아래로', onclick: mv(1) }, '↓'),
        f.id.startsWith('c') ? el('button', { class: 'mini x', 'aria-label': '항목 지우기', onclick: () => { cfg.fields.splice(i, 1); delete vals[f.id]; saveCfg(); redraw(); drawPanel(); } }, '×') : null);
    });
    return [el('div', { class: 'hint', style: 'text-align:left', text: '체크한 항목만 사진에 들어가요. 이름을 눌러 바꿀 수 있어요. (카드 모양에서 "일자"는 왼쪽 칸, "담당"은 오른쪽 아래)' }), ...rows,
      el('button', { class: 'add', onclick: () => { const id = 'c' + Date.now().toString(36); cfg.fields.push({ id, label: '항목', on: true, icon: ['clock', 'people', 'tag'][cfg.fields.length % 3] }); saveCfg(); redraw(); drawPanel(); } }, '+ 항목 추가 (예: 시간, 인원, 날씨)'),
      el('button', { class: 'add', style: 'border-style:solid;color:var(--muted)', onclick: () => { if (confirm('항목을 처음 상태(제목·일자·위치·내용·담당)로 되돌릴까요?')) { cfg.fields = DEF_FIELDS.map(f => ({ ...f })); saveCfg(); redraw(); drawPanel(); } } }, '처음 항목으로 되돌리기')];
  }
  const drawPanel = () => panel.replaceChildren(...(tab === 'look' ? lookPanel() : tab === 'fields' ? fieldsPanel() : textPanel()).filter(Boolean));
  onPhotoChange = () => { const p = photos[cur]; ['date', 'place'].forEach(k => { if (inputs[k] && document.activeElement !== inputs[k]) inputs[k].value = p[k] || ''; }); if (countEl) countEl.textContent = `${cur + 1} / ${photos.length}`; };
  const go = d => { photos[cur].look = lookOf(); cur = (cur + d + photos.length) % photos.length; useLook(photos[cur]); onPhotoChange(); drawPanel(); redraw(); };
  app.replaceChildren(
    el('div', { class: 'top' },
      el('button', { class: 'lnk', onclick: () => { if (confirm('처음으로 갈까요? 저장하지 않은 사진은 사라져요.')) { photos = []; home(); } } }, '← 처음으로'),
      el('div', { class: 'seg' }, el('button', { onclick: () => camera() }, '+ 찍기'), el('button', { onclick: () => { appendNext = true; pickIn.click(); } }, '+ 앨범'))),
    el('div', { class: 'stage' }, cv, tip,
      many ? el('button', { class: 'nav l', 'aria-label': '이전 사진', onclick: () => go(-1) }, '‹') : null,
      many ? el('button', { class: 'nav r', 'aria-label': '다음 사진', onclick: () => go(1) }, '›') : null, countEl),
    tabs, panel,
    el('div', { class: 'acts' },
      el('button', { class: 'big sec', onclick: share }, '보내기'),
      el('button', { class: 'big pri', onclick: save }, many ? `${photos.length}장 저장` : '사진첩에 저장')));
  drawTabs(); drawPanel(); onPhotoChange(); redraw();
  if (document.fonts) document.fonts.ready.then(redraw);
}
// 모양 고르기 버튼의 작은 그림
function shapeIco(k) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', 18); s.setAttribute('height', 18);
  const R = { card: '<rect x="3" y="4" width="18" height="10" rx="2"/>', strip: '<rect x="3" y="15" width="18" height="5" rx="1.5"/>', column: '<rect x="3" y="3" width="8" height="18" rx="2"/>', plain: '<path d="M4 17h12M4 20h8"/>', table: '<rect x="3" y="4" width="13" height="10" fill="none"/><path d="M3 7.5h13M3 11h13M7.5 7.5V14" fill="none" stroke-width="1.4"/>', tableH: '<rect x="3" y="4" width="13" height="3.5" stroke="none"/><rect x="3" y="4" width="13" height="10" fill="none"/><path d="M3 11h13M7.5 7.5V14" fill="none" stroke-width="1.4"/>', table2: '<rect x="3" y="4" width="18" height="7" fill="none"/><path d="M3 7.5h18M6.5 7.5V11M12 7.5V11M15 7.5V11" fill="none" stroke-width="1.4"/>' }[k];
  s.innerHTML = `<rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/><g fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round">${R}</g>`;
  return s;
}

// 글상자를 넣은 사진 파일들
async function render() {
  const out = [];
  for (const [i, p] of photos.entries()) {
    const c = document.createElement('canvas'); c.width = p.W; c.height = p.H;
    drawNote(c.getContext('2d'), p.bmp, p.W, p.H, noteFor(p));
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    const now = new Date(), name = `photo_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}_${i + 1}.jpg`;   // 한글 파일 이름은 'download'로 바뀌는 휴대폰이 있어서 영문·숫자로
    if (blob) out.push(new File([blob], name, { type: 'image/jpeg' }));
  }
  return out;
}
async function save() {
  const files = await render();
  for (const f of files) {
    const url = URL.createObjectURL(f), a = el('a', { href: url, download: f.name }); document.body.append(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 30000);
    await new Promise(r => setTimeout(r, 400));   // 여러 장을 한꺼번에 받으면 막히는 휴대폰이 있어서 조금씩 쉬어요
  }
  toast(files.length > 1 ? `${files.length}장을 저장했어요 (사진첩 > 다운로드)` : '사진을 저장했어요 (사진첩 > 다운로드)');
}
async function share() {
  const files = await render();
  if (navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files }); } catch {} }
  else { toast('이 브라우저는 바로 보내기가 안 돼요. 저장한 뒤 보내 주세요'); save(); }
}

home();
</script>
