<body>
<div id="app"></div>
<script>
// ===== 소방 사진대지 (사진 글상자에서 갈라져 나온 소방점검 전용 앱) =====
// 사진 위에 반투명 글상자(제목 · 일자 · 위치 · 내용 · 담당)를 넣어 한 장의 사진으로 저장해요.
// 앨범 사진은 사진에 들어 있는 찍은 날짜·위치(EXIF)를 읽어 저절로 채우고, 방금 찍은 사진은 지금 위치를 써요.
// 사진은 서버로 보내지 않아요. 위치 이름을 찾을 때만 좌표를 OpenStreetMap 주소 찾기에 보내요.
const app = document.getElementById('app');
// 새 버전 확인: 휴대폰이 예전 화면을 기억해 두는 경우가 있어서, 열 때·돌아올 때 서버 파일의 버전이 다르면 가운데 안내 후 새로고침해요
const PHOTO_VER = 'fire-2026-10-03f';
async function checkVer() {
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const PHOTO_VER = '([^']+)'/);
    if (m && m[1] !== PHOTO_VER && sessionStorage.getItem('fireVerTried') !== m[1]) {
      sessionStorage.setItem('fireVerTried', m[1]);
      const n = el('div', { style: 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;pointer-events:none' },
        el('div', { style: 'background:#C8793A;color:#fff;font-weight:800;font-size:18px;border-radius:18px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.3)', text: '새 버전으로 바꿀게요' }));
      document.body.append(n); setTimeout(() => location.reload(), 1800);
    }
  } catch {}
}
checkVer();
// 명조 글꼴은 캔버스가 쓸 때 저절로 받지 않아서 미리 받아 두고 다시 그려요
try { document.fonts.load("700 20px 'Noto Serif KR'", '점심 삼대째손두부').then(() => { if (typeof redraw === 'function') redraw(); }); } catch {}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !photos.length) checkVer(); });
const ls = {
  get(k, d) { try { const v = localStorage.getItem('fireSheet:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fireSheet:' + k, JSON.stringify(v)); } catch {} }
};
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
let toastT = 0;
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', { class: 'toast', role: 'status', text: msg }); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;

// ---------- 사진 속 정보(EXIF): 찍은 날짜와 GPS ----------
async function readExif(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return {};

// 사진마다 따로 적는 칸(소방점검 양식의 설비명·불량내용 등)은 예시 글로 시작해요
const perDefaults = () => Object.fromEntries(cfg.fields.filter(f => f.per && !['date', 'place'].includes(f.id)).map(f => [f.id, lastOr(f.id)]));
// 칸 값 읽기·쓰기(사진마다 칸이면 그 사진에, 아니면 모든 사진에 같이)
const getVal = (p, id) => { const f = cfg.fields.find(x => x.id === id); return ((f && f.per) ? p?.[id] : vals[id]) || ''; };

// 사진 한 장 정보: 그림 · 크기 · 일자 · 위치(사진마다)
function photoOf(bmp, d, lat, lng) {
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  return { bmp, W: Math.round(bmp.width * s), H: Math.round(bmp.height * s), date: fmtDate(d), lat: lat ?? null, lng: lng ?? null, place: cfg.mode === 'fire' ? lastOr('place') : EX.place, look: lookOf(), ...perDefaults() };   // 위치는 찾으면 바꿔요
}
async function fillPlaces(list, here) {

  if (cfg.mode === 'fire') return;   // 소방점검의 위치는 건물 안 위치(층·실)라 동네 이름으로 채우지 않아요
  for (const p of list) if (p.lat != null && (!p.place || p.place === EX.place)) { const n = await placeName(p.lat, p.lng); if (n && (!p.place || p.place === EX.place)) { p.place = n; if (photos[cur] === p && onPhotoChange) onPhotoChange(); redraw(); } }

async function load(files, fresh) {

  const here = fresh ? hereNow() : null, list = [];
  for (const file of files.slice(0, 20)) {
    try { const bmp = await createImageBitmap(file), ex = await readExif(file); list.push(photoOf(bmp, ex.date || new Date(file.lastModified || Date.now()), ex.lat, ex.lng)); } catch {}
  }

// 글상자를 손가락으로 끌어 옮겨요(편집 화면·카메라 화면 같이 씀). getBox: 지금 그린 자리, size: 그림 크기
function dragBox(canvas, getBox, size, onMove, onTap) {
  let drag = null;
  const toImg = e => { const r = canvas.getBoundingClientRect(), [W, H] = size(), s = Math.min(r.width / W, r.height / H), ox = (r.width - W * s) / 2, oy = (r.height - H * s) / 2;
    return [(e.clientX - r.left - ox) / s, (e.clientY - r.top - oy) / s]; };
  canvas.addEventListener('pointerdown', e => {
    const b = getBox(); if (!b) return; const [x, y] = toImg(e), pad = 30;
    if (x < b.x - pad || x > b.x + b.w + pad || y < b.y - pad || y > b.y + b.h + pad) return;
    drag = { dx: x - b.x, dy: y - b.y, sx: e.clientX, sy: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => { if (!drag) return; if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return; drag.moved = true; const [x, y] = toImg(e), [W, H] = size(); cfg.at[cfg.layout] = { x: (x - drag.dx) / W, y: (y - drag.dy) / H }; onMove(); });
  const end = () => { if (drag) { drag = null; saveCfg(); } };
  canvas.addEventListener('pointerup', () => { const tap = drag && !drag.moved; end(); if (tap && onTap) onTap(); }); canvas.addEventListener('pointercancel', end);

    const g = ghostP(), bg = el('div', { class: 'sheet-bg', onclick: e => { if (e.target === bg) bg.remove(); } });

  dragBox(ov, () => box, () => [video.videoWidth || 1, video.videoHeight || 1], () => {}, editText);

// 소방점검 사진대지: 사진마다 설비명·위치·불량내용·조치사항 표를 붙여 A4 두 장씩. 인쇄 창에서 'PDF로 저장'도 돼요

async function render(list = photos) {

    const c = document.createElement('canvas'); c.width = p.W; c.height = p.H;

    const now = new Date(), name = `photo_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}_${i + 1}.jpg`;   // 한글 파일 이름은 'download'로 바뀌는 휴대폰이 있어서 영문·숫자로
    if (blob) out.push(new File([blob], name, { type: 'image/jpeg' }));
  }
  return out;

async function save() {
